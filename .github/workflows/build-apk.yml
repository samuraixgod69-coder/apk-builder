name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare files and settings
        run: bash scripts/prepare.sh

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          NAME=$(grep '^APP_NAME=' app.config | head -1 | cut -d= -f2- | tr -cd 'A-Za-z0-9_-')
          cp app/build/outputs/apk/debug/app-debug.apk "${NAME:-app}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "*.apk"
