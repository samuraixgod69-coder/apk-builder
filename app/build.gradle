plugins {
    id 'com.android.application'
}

android {
    namespace 'com.webapp.wrapper'
    compileSdk 34

    defaultConfig {
        applicationId = (project.findProperty('packageId') ?: 'com.webapp.myapp').toString()
        minSdk 21
        targetSdk 34
        versionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
        versionName = (project.findProperty('versionName') ?: '1.0').toString()
        resValue 'string', 'app_name', (project.findProperty('appName') ?: 'My App').toString()
        buildConfigField 'String', 'START_URL', '"' + (project.findProperty('startUrl') ?: '').toString() + '"'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs = ['../www']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
